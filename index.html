<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- icona e nome quando si aggiunge il sito alla schermata home del telefono -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Giramondo" />
    <meta name="theme-color" content="#58cc02" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&display=swap" rel="stylesheet" />
    <style>
      /* schermata iniziale: il mappamondo e la puntina che ci cade sopra formano l'icona; la toglie main.jsx */
      #splash { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; background: #f7f7f7; }
      #splash svg { width: 240px; overflow: visible; } /* 240px: 1 unità del disegno = 240/512 px, conta per la caduta */
      /* dalla home dell'iPhone la pagina comincia sotto la barra di stato: senza alzarlo il disegno sembra basso */
      #splash svg { translate: 0 -32px; }
      /* il mondo arriva rotolando da sinistra: un giro intero = 2π × raggio (142) ≈ 892, così non slitta */
      #splash .globe { transform-origin: 256px 300px; animation: roll .9s cubic-bezier(.3, .7, .4, 1) both; }
      #splash .ground { animation: slide .9s cubic-bezier(.3, .7, .4, 1) both; }
      #splash .pin { transform-origin: 256px 266px; animation: drop .8s .8s both; }
      #splash .shadow { transform-origin: 256px 268px; animation: shadow .8s .8s both; }
      @keyframes roll { from { transform: translateX(-892px) rotate(-360deg); opacity: 0; } 15% { opacity: 1; } }
      @keyframes slide { from { transform: translateX(-892px); opacity: 0; } 15% { opacity: 1; } }
      @keyframes drop {
        /* parte da fuori schermo: 120vh in unità del disegno sono ~56vh sullo schermo, più di quanto la separa dal bordo in alto */
        from { transform: translateY(-120vh); animation-timing-function: cubic-bezier(.5, 0, 1, 1); } /* cade accelerando */
        50% { transform: scale(1.15, .85); animation-timing-function: ease-out; } /* si schiaccia toccando il mondo */
        70% { transform: translateY(-36px); animation-timing-function: ease-in; } /* rimbalzo */
        85%, to { transform: none; }
      }
      @keyframes shadow { from { transform: scale(0); } 50% { transform: scale(1.2); } 70% { transform: scale(.8); } 85%, to { transform: none; } }
      /* uscita: l'icona resta ferma un attimo (.8s), la puntina si ritira con un rimbalzino,
         poi il mondo riparte rotolando verso destra; solo quando è uscito lo sfondo sfuma e si vede l'app */
      #splash.out { background-color: transparent; transition: background-color .3s 1.9s; }
      #splash.out .pin, #splash.out .shadow { animation: shrink .4s .8s both; }
      #splash.out .globe { animation: roll-out .8s 1.1s cubic-bezier(.6, 0, .7, .4) both; }
      #splash.out .ground { animation: slide-out .8s 1.1s cubic-bezier(.6, 0, .7, .4) both; }
      @keyframes shrink { 40% { transform: scale(1.15); } to { transform: scale(0); } }
      @keyframes roll-out { 85% { opacity: 1; } to { transform: translateX(892px) rotate(360deg); opacity: 0; } }
      @keyframes slide-out { 85% { opacity: 1; } to { transform: translateX(892px); opacity: 0; } }
      @media (prefers-reduced-motion: reduce) { #splash * { animation: none !important; } }
    </style>
    <title>Giramondo · Impara le capitali</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- copia del disegno di public/favicon.svg, con mappamondo e puntina separati per animarli -->
    <div id="splash" aria-hidden="true">
      <svg viewBox="0 0 512 512">
        <defs><clipPath id="splash-globe"><circle cx="256" cy="300" r="142" /></clipPath></defs>
        <ellipse class="ground" cx="256" cy="450" rx="112" ry="10" fill="#000" fill-opacity=".08" />
        <g class="globe">
          <g clip-path="url(#splash-globe)">
            <rect x="100" y="150" width="320" height="300" fill="#1899d6" />
            <circle cx="240" cy="284" r="142" fill="#1cb0f6" />
            <g fill="#89e219">
              <path d="M150 240 Q170 205 210 214 Q232 236 214 262 Q200 290 214 318 Q196 344 172 322 Q160 290 146 276 Z" />
              <path d="M296 286 Q330 270 358 290 Q372 318 348 336 Q352 368 326 392 Q300 396 300 362 Q296 334 284 316 Z" />
            </g>
            <g fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="12">
              <ellipse cx="256" cy="300" rx="62" ry="142" />
              <path d="M100 300 H412 M128 240 Q256 262 384 240 M128 360 Q256 382 384 360" />
            </g>
          </g>
        </g>
        <ellipse class="shadow" cx="256" cy="268" rx="34" ry="10" fill="#000" fill-opacity=".2" />
        <g class="pin">
          <path d="M256 266 C236 236 176 204 176 148 A80 80 0 1 1 336 148 C336 204 276 236 256 266 Z" fill="#ff4b4b" />
          <path d="M256 266 C276 236 336 204 336 148 A80 80 0 0 0 296 79 C318 110 316 170 256 266 Z" fill="#ea2b2b" />
          <ellipse cx="210" cy="102" rx="13" ry="7" transform="rotate(-45 210 102)" fill="#fff" fill-opacity=".45" />
          <circle cx="256" cy="148" r="50" fill="#fff" />
          <path d="M256 112 L264.8 135.9 L290.2 136.9 L270.3 152.6 L277.2 177.1 L256 163 L234.8 177.1 L241.7 152.6 L221.8 136.9 L247.2 135.9 Z"
            fill="#ffc800" stroke="#ffb100" stroke-width="5" stroke-linejoin="round" />
        </g>
      </svg>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
